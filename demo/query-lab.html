<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HanShape Query Lab</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin:0; background:#0f172a; color:#e5e7eb; }
    main { max-width:1100px; margin:auto; padding:28px 18px 48px; }
    .grid { display:grid; grid-template-columns:1.1fr .9fr; gap:16px; }
    .card { background:#1e293b; border:1px solid #334155; border-radius:14px; padding:18px; }
    @media (max-width:800px){ .grid{grid-template-columns:1fr;} }
    input,button { width:100%; box-sizing:border-box; border:1px solid #475569; border-radius:10px; padding:12px; background:#0f172a; color:#f8fafc; font:inherit; }
    button { cursor:pointer; } button:hover:not(:disabled){border-color:#94a3b8;}
    .examples { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .examples button { width:auto; }
    pre { white-space:pre-wrap; word-break:break-word; background:#020617; padding:12px; border-radius:10px; overflow:auto; }
    .chars { display:flex; flex-wrap:wrap; gap:8px; }
    .char { width:58px; height:58px; display:grid; place-items:center; border:1px solid #475569; border-radius:10px; font-size:30px; background:#0f172a; }
    .muted { color:#94a3b8; } .status{min-height:24px;margin-top:10px;color:#fbbf24;}
    .obs { display:grid; gap:10px; }
    .obs-row { border:1px solid #334155; border-radius:10px; padding:12px; }
    .values { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .values button { width:auto; }
    code { background:#020617; padding:2px 5px; border-radius:5px; }
  </style>
</head>
<body>
<main>
  <h1>HanShape Query Lab</h1>
  <p class="muted">Từ query hiện tại → candidate set → HanShape gợi ý observation tiếp theo. Chọn giá trị bạn thực sự nhìn thấy.</p>
  <p><a href="/demo/study-lab.html">→ Human Effort Study</a></p>

  <section class="card">
    <label for="input">Input</label>
    <input id="input" spellcheck="false" value="35 len(C.hUpper,C.hLower)<" placeholder="Ví dụ: 35 len(C.hUpper,C.hLower)<">
    <div class="examples" id="examples"></div>
    <div id="status" class="status"></div>
  </section>

  <section class="grid" style="margin-top:16px">
    <div class="card">
      <h2>Semantic AST</h2>
      <pre id="ast">{}</pre>
      <h2>Candidate set</h2>
      <div id="candidates" class="chars"></div>
    </div>

    <div class="card">
      <h2>Observation guidance</h2>
      <div id="guidance" class="obs"></div>
    </div>
  </section>
</main>
<script type="module" src="/demo/query-lab.js"></script>
</body>
</html>

name: HanShape tests

on:
  push:
    branches: ["main", "feat/**", "research/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run benchmark:adaptive
      - run: npm run benchmark:lookahead
      - run: npm run benchmark:pairs
      - run: npm run benchmark:observation-path
